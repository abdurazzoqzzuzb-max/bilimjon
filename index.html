<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F7BEA">
<title>Bilimjon</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bilimjon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5FA;--card:#FFFFFF;--ink:#172033;--mut:#5B6478;--line:#E1E6EF;--acc:#2F7BEA;--acc2:#1C55B0;--onacc:#fff;--ok:#2E9E44;--no:#D93838;--warn:#F2A900;--opt:#fff;--optink:#172033;--optline:#D5DCE8;--q:#172033;--r:22px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1320;--card:#171E2E;--ink:#E8ECF5;--mut:#9AA4B8;--line:#2A3348;--acc:#4C8DF6;--acc2:#2A5FB8;--q:#E8ECF5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1320;--card:#171E2E;--ink:#E8ECF5;--mut:#9AA4B8;--line:#2A3348;--acc:#4C8DF6;--acc2:#2A5FB8;--q:#E8ECF5;color-scheme:dark}
body.th-garaj{--bg:#12161F;--card:#1E2533;--ink:#F5F7FA;--mut:#A9B3C4;--line:#2E3748;--acc:#FFC400;--acc2:#C79200;--onacc:#1A1A1A;--q:#FFFFFF;color-scheme:dark}
body.th-orol{--bg:#3B1E6E;--card:rgba(255,255,255,.14);--ink:#FFFFFF;--mut:#F3D3F0;--line:rgba(255,255,255,.25);--acc:#FF4FB0;--acc2:#B81F78;--onacc:#fff;--q:#FFFFFF;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:"Baloo 2","Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.35;min-height:100vh;-webkit-font-smoothing:antialiased}
body.th-garaj{background:radial-gradient(ellipse at 50% -10%,rgba(255,196,0,.18),transparent 55%),linear-gradient(#141925,#0E1119)}
body.th-orol{background:linear-gradient(170deg,#3B1E6E 0%,#7A2E92 45%,#C2408F 100%) fixed}
#app{max-width:520px;margin:0 auto;min-height:100vh}
.wrap{padding:10px 16px 40px}
.wrap.play{padding:10px 12px 40px}
h1,h2,h3{margin:.3em 0;line-height:1.15}h1{font-size:2rem;font-weight:800}h2{font-size:1.35rem;font-weight:800}h3{font-size:1.1rem;font-weight:800}
p{margin:.4em 0}.sm{font-size:.85rem}.mut{color:var(--mut)}.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;gap:8px;min-height:60px}.top .ttl{font-weight:800;font-size:1.15rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.sp{flex:1}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:800;white-space:nowrap}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:56px;min-width:56px;padding:8px 18px;border:0;border-radius:18px;background:var(--acc);color:var(--onacc);font-weight:800;font-size:1.05rem;box-shadow:0 5px 0 var(--acc2);transition:transform .06s,box-shadow .06s;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--acc2)}.btn:disabled{opacity:.45;pointer-events:none}
.btn.big{width:100%;font-size:1.3rem;min-height:64px}
.btn.alt{background:#FF6D00;color:#fff;box-shadow:0 5px 0 #B34A00}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.sm{font-size:.9rem;padding:6px 12px}
.btn.danger{background:var(--no);color:#fff;box-shadow:0 5px 0 #8E1F1F}
.ib{width:56px;height:56px;flex:0 0 56px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:1.4rem;display:inline-flex;align-items:center;justify-content:center;padding:0}
.ib.av{font-size:1.8rem}
.row{display:flex;gap:10px;align-items:center;margin:10px 0}.row.wrapr{flex-wrap:wrap}.row>.btn{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
body.th-orol .card{backdrop-filter:blur(6px)}
.note{background:rgba(47,123,234,.1);border:1px solid rgba(47,123,234,.25);border-radius:16px;padding:10px 12px;margin:10px 0;font-size:.95rem}
.note.err{background:#FDECEC;border:2px solid #D93838;color:#5A1010}.note.sinov{background:#FFF4D6;border:2px solid #F2A900;color:#4A3500}
.note.kn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);font-weight:700}.note.gold{background:rgba(255,196,0,.18);border-color:#FFC400}
.inp{width:100%;min-height:56px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:10px 12px;font:inherit;margin:4px 0}
textarea.inp{min-height:160px;font-size:.8rem}
.lb{display:block;font-weight:800;margin-top:12px;font-size:.95rem}
.chk{display:flex;gap:10px;align-items:center;margin:12px 0;min-height:44px}.chk input{width:26px;height:26px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#172033;color:#fff;padding:12px 18px;border-radius:16px;z-index:70;font-weight:700;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:tin .25s}
.kombo{position:fixed;left:50%;top:70%;transform:translate(-50%,-50%);z-index:70;pointer-events:none;font:900 2.4rem/1 "Baloo 2",system-ui,sans-serif;color:#FFC400;text-shadow:0 3px 0 #B35A00,0 0 18px rgba(255,140,0,.75);animation:kmb 1.5s ease-out forwards;text-align:center;white-space:nowrap}
.kombo small{display:block;margin-top:4px;font-size:1.1rem;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.45)}.kombo.orol{color:#FF6FC0;text-shadow:0 3px 0 #8E1A5C,0 0 18px rgba(255,79,176,.75)}.kombo.k2,.kombo.k3{font-size:3.1rem}
@keyframes kmb{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}18%{transform:translate(-50%,-50%) scale(1.3);opacity:1}30%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{transform:translate(-50%,-110%) scale(1);opacity:0}}
.dam{text-align:center}.damdrg{position:relative;display:inline-block}.zzz{position:absolute;right:-6px;top:4px;font-weight:800;color:var(--mut);animation:float 2.4s ease-in-out infinite}
.sovga{display:flex;gap:12px;align-items:center}.sgimg{width:84px;height:84px;object-fit:cover;border-radius:16px;flex:none;background:#fff}.sgsir{width:84px;height:84px;border-radius:16px;flex:none;display:grid;place-items:center;font-size:3rem;background:linear-gradient(135deg,var(--acc),var(--acc2));animation:sgw 2.6s ease-in-out infinite}
@keyframes sgw{50%{transform:rotate(-6deg) scale(1.06)}}.sgb{flex:1;min-width:0}.sgb .tbar{margin:6px 0 4px}.sovga.yetdi{box-shadow:0 0 0 3px var(--warn) inset}.hx .tl{margin:6px 0;padding-left:18px}.hx .tl li{margin:3px 0;font-size:.92rem}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
.scrim{position:fixed;inset:0;background:rgba(5,8,15,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:18px 16px 28px;max-height:88vh;overflow:auto;text-align:center}
body.th-orol .sheet{background:#4A2580}
.tl{text-align:left;padding-left:20px}
/* --- onboarding, picker --- */
.hero{text-align:center;padding:10px 0}.hero.sm h1{font-size:1.7rem}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kid{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:130px;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:12px;box-shadow:0 5px 0 var(--line)}
.kid .av{font-size:3rem;line-height:1.1}.kid b{font-size:1.15rem}
.world{display:flex;flex-direction:column;align-items:center;width:100%;border:0;border-radius:26px;padding:14px;margin:12px 0;min-height:220px;color:#fff;text-align:center;gap:4px;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.world b{font-size:1.4rem}.world.garaj{background:linear-gradient(160deg,#232B3B,#0F131C);border:3px solid #FFC400}.world.orol{background:linear-gradient(160deg,#6A3FB8,#E35BB0)}
.wpic{min-height:120px;display:flex;align-items:center}
/* --- kid home --- */
.scene{position:relative;height:250px;border-radius:24px;overflow:hidden;margin:6px 0 10px}
.scene.garaj{background:radial-gradient(ellipse at 50% 0%,rgba(255,214,0,.28),transparent 60%),repeating-linear-gradient(90deg,#1b2130 0 42px,#1f2738 42px 84px);border:3px solid #2b3446}
.scene.garaj::before{content:"";position:absolute;left:0;right:0;top:0;height:16px;background:repeating-linear-gradient(45deg,#FFC400 0 14px,#1A1A1A 14px 28px)}
.scene .lift{position:absolute;left:8%;right:8%;bottom:22px;height:14px;background:repeating-linear-gradient(45deg,#FFC400 0 14px,#1A1A1A 14px 28px);border-radius:6px}
.scene .carw{position:absolute;left:50%;bottom:34px;transform:translateX(-46%);width:80%;max-width:300px;animation:idle 1.6s ease-in-out infinite}
.scene.orol{border:3px solid rgba(255,255,255,.3)}.scene.orol .island{position:absolute;inset:0}
.scene .peg{position:absolute;left:50%;top:6%;transform:translateX(-42%);width:66%;max-width:240px;animation:float 3s ease-in-out infinite}
.scene .drg{position:absolute;left:4px;bottom:0}
@keyframes idle{50%{transform:translate(-46%,-3px)}}@keyframes float{50%{transform:translate(-42%,-10px)}}
.bubble{position:relative;background:#fff;color:#172033;border-radius:18px;padding:10px 14px;font-weight:700;margin:4px 0 12px 64px}
.bubble::before{content:"";position:absolute;left:-10px;top:14px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.cta{margin:8px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stats>div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;text-align:center;display:flex;flex-direction:column}.stats b{font-size:1.3rem}.stats span{font-size:.8rem;color:var(--mut)}
.coll{display:flex;flex-wrap:wrap;gap:6px;font-size:1.6rem;justify-content:center;margin:8px 0}
.trek{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 12px;margin:10px 0}.trek .tl{font-weight:800;padding:0}
.tr{display:grid;grid-template-columns:32px 1fr 28px;gap:8px;align-items:center;margin:4px 0}.tav{font-size:1.4rem}
.tbar{height:12px;background:var(--line);border-radius:999px;overflow:hidden}.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#FF6D00);border-radius:999px}
/* --- mission --- */
.road{position:relative;height:30px;background:#2B2B2B;border-radius:999px;margin:4px 0 12px;overflow:visible;border:2px solid rgba(255,255,255,.12)}
.road::after{content:"";position:absolute;left:12px;right:30px;top:13px;border-top:3px dashed rgba(255,214,0,.7)}
.rfill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(255,196,0,.15),rgba(255,109,0,.45));border-radius:999px;transition:width .4s}
.rcar{position:absolute;top:-4px;font-size:1.6rem;transition:left .5s;transform:scaleX(-1)}body.th-orol .rcar{transform:none}.rflag{position:absolute;right:4px;top:-2px;font-size:1.3rem}
body.th-orol .road{background:rgba(255,255,255,.18)}
.item{display:flex;flex-direction:column;gap:6px}
.q{font-size:1.45rem;font-weight:800;color:var(--q);text-align:center;margin:4px 0;overflow-wrap:anywhere}.q.big{font-size:2.1rem}.q2{text-align:center;color:var(--mut);font-weight:700}
.arab{font-family:"Geeza Pro","Noto Naskh Arabic","Amiri","Times New Roman",serif;font-weight:400;line-height:1.6}.q.arab{font-size:3rem}.arab.big{font-size:4rem;text-align:center;color:var(--q)}.visw .arab{color:#172033}
.visw{display:flex;justify-content:center;background:#fff;border-radius:18px;padding:8px;color:#172033}
.vis{width:100%;max-width:420px;height:auto;max-height:230px}.soat{max-width:220px}
.raqam{font-size:5rem;font-weight:800;color:#2F7BEA;line-height:1}
.bigemo{font-size:5rem;line-height:1.1}
.qator{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;font-size:2rem}.qator .q{font-size:2rem}
.ustun{display:inline-block;font-size:2rem;font-weight:800;padding:4px 14px;color:#172033}.ustun .ur{display:flex;justify-content:flex-end}.ustun .ur span{width:1.3em;text-align:center}.ustun .uo{width:1.1em!important;color:#E65100}.ustun .ul{border-top:3px solid #172033;margin:2px 0}
.say{align-self:center}
.opts{display:grid;gap:10px;margin-top:6px}.opts.grid2{grid-template-columns:1fr 1fr}.opts.col{grid-template-columns:1fr}
.opt{position:relative;min-height:72px;min-width:56px;background:var(--opt);color:var(--optink);border:3px solid var(--optline);border-radius:20px;padding:8px;font-weight:800;font-size:1.25rem;box-shadow:0 5px 0 var(--optline);display:flex;align-items:center;justify-content:center;text-align:center;transition:transform .06s}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 var(--optline)}
.opts.short .opt{font-size:2rem;min-height:84px}.opts.pic .opt{min-height:110px}
.opt .oe{font-size:3.2rem;line-height:1}.opt .ov{width:100%}.opt .ov .vis{max-height:96px}.opt .shp{width:70px;height:70px}.opt .arab{font-size:2.6rem}
.opt.ok{border-color:var(--ok);background:#E7F7EA;box-shadow:0 5px 0 var(--ok)}.opt.no{border-color:var(--no);background:#FDECEC;animation:shk .35s;box-shadow:0 5px 0 var(--no)}.opt:disabled{opacity:1}.opt.no:disabled{opacity:.55}
@keyframes shk{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.locked .opt,.locked .tile{pointer-events:none;opacity:.6}
.locked::before{content:"";display:block;height:5px;border-radius:5px;background:var(--acc);animation:lockbar 1.5s linear forwards;margin-bottom:6px}
@keyframes lockbar{from{width:0}to{width:100%}}
.hint,.good,.explain{border-radius:16px;padding:10px 12px;font-weight:700;margin-top:8px;color:#172033}
.hint{background:#FFF4D6;border:2px solid #F2A900}.good{background:#E7F7EA;border:2px solid var(--ok)}.explain{background:#fff;border:2px solid #90A4AE}
.dars{background:#fff;color:#172033;border:3px solid #7C4DFF;border-radius:20px;padding:14px;display:grid;gap:10px;margin-top:6px}.dars .dh{display:flex;gap:8px;align-items:center;font-weight:800;font-size:1.15rem}.dars .dkat{font-size:.88rem;color:#5B6478;font-weight:700}.dars .dq{background:#F1ECFF;border-radius:14px;padding:10px 12px;font-weight:700;line-height:1.45}.dars .dex{border:2px dashed #C9BDF5;border-radius:14px;padding:10px 12px;display:grid;gap:6px}.dars .dl{font-size:.85rem;color:#5B6478;font-weight:700}.dars .dsav{font-weight:800;font-size:1.1rem}.dars .dsteps{margin:0;padding-left:1.4em;display:grid;gap:6px;font-weight:700;line-height:1.4}.dars .dans{background:#E7F7EA;border:2px solid #2E9E5B;border-radius:14px;padding:8px 12px;font-weight:800}.dars .dnext{margin:0;font-weight:800;text-align:center}.dars .btn[disabled]{opacity:.55}
.otatip{background:rgba(255,255,255,.08);border:1px dashed var(--line);border-radius:14px;padding:8px 10px;margin-top:8px;font-size:.9rem}.otatip summary{cursor:pointer;font-weight:800;min-height:32px}
.matn{background:#fff;color:#172033;border-radius:16px;padding:10px 12px;font-size:1.1rem}.matn summary{font-weight:800;cursor:pointer}
/* special types */
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.slot{min-width:56px;min-height:64px;border-radius:14px;border:3px dashed var(--optline);background:rgba(255,255,255,.9);color:#172033;font-size:1.7rem;font-weight:800}.slot.f{border-style:solid;border-color:var(--acc)}.slot.no{border-color:var(--no);background:#FDECEC}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.tile{min-width:56px;min-height:60px;border-radius:14px;border:0;background:#fff;color:#172033;font-size:1.6rem;font-weight:800;box-shadow:0 5px 0 #C9D2E0}.tile:disabled{opacity:.25}
.tart{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tb .badge{position:absolute;top:6px;left:8px;font-style:normal;font-size:1rem;background:var(--ok);color:#fff;border-radius:999px;min-width:24px}.tb .badge:empty{display:none}
.farq{display:flex;flex-direction:column;gap:8px}.fg{display:grid;gap:6px}
.fc{min-height:56px;min-width:56px;font-size:1.9rem;background:#fff;border:2px solid #D5DCE8;border-radius:12px;padding:0}.fc.ok{border-color:var(--ok);background:#E7F7EA}.fc.no{border-color:var(--no);animation:shk .35s}.fc.blink{animation:blink .4s 4}
.fc.fl{display:flex;align-items:center;justify-content:center;min-height:44px;min-width:0;font-size:1.5rem}
@keyframes blink{50%{background:#FFE082}}
.mz{background:#fff;border-radius:18px;padding:8px}.maze{width:100%;height:auto;max-height:52vh}.maze line{stroke:#263238;stroke-width:3;stroke-linecap:round}.mz.bump{animation:shk .25s}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:8px;justify-content:center;margin-top:10px}.pb{width:72px;height:64px;border-radius:16px;border:0;background:#fff;font-size:1.8rem;box-shadow:0 5px 0 #C9D2E0}
.sud{display:grid;margin:0 auto;width:fit-content;border:3px solid #263238;border-radius:8px;overflow:hidden;background:#fff}
.sc{width:64px;height:64px;min-width:56px;min-height:56px;border:1px solid #B0BEC5;background:#fff;color:#1565C0;font-size:1.8rem;font-weight:800;padding:0}.sud.n6 .sc{width:56px;height:56px;font-size:1.5rem}
.sc.g{color:#172033;background:#EEF2F7}.sc.sel{background:#FFF4D6;box-shadow:inset 0 0 0 3px #F2A900}.sc.no{background:#FDECEC}.sc.br{border-right:3px solid #263238}.sc.bb{border-bottom:3px solid #263238}
.pal{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}.pv{min-width:56px;min-height:60px;border-radius:14px;border:0;background:#fff;color:#172033;font-size:1.6rem;font-weight:800;box-shadow:0 5px 0 #C9D2E0}
.mem{display:grid;gap:8px}.mc{min-height:76px;min-width:56px;border-radius:14px;border:0;background:linear-gradient(135deg,var(--acc),var(--acc2));font-size:2.2rem;padding:0}.mc span{visibility:hidden}.mc.up,.mc.ok{background:#fff}.mc.up span,.mc.ok span{visibility:visible}.mc.ok{box-shadow:inset 0 0 0 3px var(--ok)}
.izw{display:flex;justify-content:center;background:#fff;border-radius:18px;padding:8px}.izc{touch-action:none;border-radius:12px;background:repeating-linear-gradient(#fff 0 24px,#E3F2FD 24px 25px)}
.board{position:relative;background:#fff;border-radius:18px;margin:0 auto;width:100%;max-width:360px;aspect-ratio:100/80;touch-action:none}.bsv{position:absolute;inset:0;width:100%;height:100%}
.slotg *{fill:rgba(47,123,234,.06);stroke:#90A4AE;stroke-width:.8;stroke-dasharray:2 1.5}.placed{position:absolute;inset:0;pointer-events:none}.pp{position:absolute;animation:pop .3s}
.tray{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;min-height:90px;margin:10px 0;padding:8px;background:rgba(255,255,255,.12);border-radius:16px}
.part{touch-action:none;cursor:grab;padding:4px;border-radius:10px}.part.sel{outline:3px solid #F2A900}.part.drag{position:relative;z-index:30;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
@keyframes pop{from{transform:scale(.6)}}
.kcard{background:#fff;color:#172033;border-radius:22px;padding:16px;text-align:center}.kem{font-size:4rem}.ktxt{font-size:1.15rem;text-align:left}

  { id: 'm3', d: 1, nom: "Bog'da", t: "Bahor keldi. Bog'da olma va o'rik gulladi. Ari gulga qo'ndi. Bobom daraxtlarga suv quydi. Men bobomga yordam berdim. Bobom: «Barakalla!» — dedi.", s: [["Bog'da nima gulladi?", "olma va o'rik", 'atirgul va lola', 'uzum va anor'], ['Daraxtlarga kim suv quydi?', 'bobom', 'oyim', 'akam'], ['Bobom nima dedi?', '«Barakalla!»', '«Rahmat!»', '«Xayr!»']] },
  { id: 'm4', d: 2, nom: 'Bolalar huquqlari', t: "Har bir bolaning huquqlari bor. Bola o'qish va bilim olish huquqiga ega. U sog'lom o'sishi, to'yib ovqatlanishi va dam olishi kerak. Har bir bola o'ynashga ham haqli. Bolani hech kim xafa qilmasligi, urmasligi kerak. Bola o'z fikrini aytishi mumkin, kattalar uni tinglaydi. Huquq bilan birga burch ham bor: bola o'qishi, kattalarni hurmat qilishi va kichiklarga g'amxo'rlik qilishi lozim. Huquqlarimizni bilish — o'zimizni va boshqalarni asrash demakdir.", s: [['Bola nimaga haqli?', "o'qish va o'ynashga", 'hech narsaga', 'faqat uxlashga'], ['Huquq bilan birga nima bor?', 'burch', "sovg'a", 'pul'], ['Bolaning burchi qaysi?', 'kattalarni hurmat qilish', 'kun bo\'yi o\'ynash', 'darsni tashlash']] },
  { id: 'm5', d: 2, nom: 'Yettita rang', t: "Yomg'irdan keyin Zarina derazaga qaradi. Osmonda katta kamalak paydo bo'ldi. «Buvijon, kamalak nega rang-barang?» — deb so'radi u. Buvisi kulib javob berdi: «Quyosh nuri yomg'ir tomchilaridan o'tib, ranglarga bo'linadi». Zarina ranglarni sanadi: qizil, to'q sariq, sariq, yashil, havorang, ko'k, binafsha. «Yettita ekan!» — dedi u xursand bo'lib. Keyin u daftariga kamalak chizdi va uni buvisiga sovg'a qildi. Buvisi rasmni devorga osib qo'ydi.", s: [["Kamalak qachon paydo bo'ldi?", "yomg'irdan keyin", 'kechasi', 'qor yoqqanda'], ['Zarina nechta rang sanadi?', 'yettita', 'beshta', "o'nta"], ["Zarina rasmni kimga sovg'a qildi?", 'buvisiga', 'onasiga', "do'stiga"]] },
  { id: 'm6', d: 2, nom: 'Bobomning bog\'i', t: "Sardorning bobosi va buvisi qishloqda yashaydi. Har yozda Sardor ularnikiga boradi. Bobosi unga bog'dagi daraxtlarni ko'rsatadi: «Bu o'rikni otang tug'ilganda ekkanman, bu yong'oqni esa sen tug'ilganda». Sardor o'z yong'og'iga suv quyadi va undan baland bo'lishni orzu qiladi. Buvisi kechqurun ertak aytib beradi. Sardor qishloqda yangi do'stlar ham orttirdi. Yoz tugaganda u shaharga qaytadi, lekin keyingi yozni sabrsizlik bilan kutadi.", s: [["Bobosi o'rikni qachon ekkan?", 'otasi tug\'ilganda', 'Sardor tug\'ilganda', "o'tgan yili"], ['Buvisi kechqurun nima qiladi?', 'ertak aytadi', 'non yopadi', 'televizor ko\'radi'], ['Sardor qishloqqa qachon boradi?', 'har yozda', 'har qishda', 'har kuni']] }

/* ================= 📚 BUGUNGI QIYINLAR (0.2.0): Claude kichik dars yozishi uchun kunlik matn ================= */
let QKUN = null;
function qiyinMatn(kun) {
  const L = A.bolalar(), out = [`BILIMJON-QIYIN|v${A.VER}|${kun}|bolalar=${L.length}`], odam = [];
  L.forEach(b => {
    const log = A.readLog(b.id, kun), ans = log.filter(e => e.t === 'ans'), dars = log.filter(e => e.t === 'dars'), ch = log.filter(e => e.t === 'charch').map(e => e.fan || e.k), oy = log.filter(e => e.t === 'oyin'), g = {};
    const G0 = id => g[id] || (g[id] = { n: 0, xato: 0, dars: 0, egz: 0, egzOk: 0, ex: [] });
    ans.forEach(e => { const x = G0(e.tugun); x.n++; if (e.tur === 'dars') { x.egz++; if (e.togri) x.egzOk++; } if (!e.togri_1) { x.xato++; if (x.ex.length < 3) x.ex.push(e); } });
    dars.forEach(e => { G0(e.tugun).dars++; });
    const ids = Object.keys(g).filter(id => g[id].xato || g[id].dars).sort((p, q) => g[q].xato - g[p].xato);
    out.push(`BOLA|${b.kod}|daraja=${b.daraja}|javob=${ans.length}|xato=${ans.filter(e => !e.togri_1).length}|dars=${dars.length}|charch=${ch.join(',') || '-'}|oyin=${oy.length}`);
    ids.forEach(id => { const x = g[id], nom = (BJ.gen.reg[id] || {}).nom || id; out.push(`Q|${id}|${nom}|n=${x.n}|xato=${x.xato}|dars=${x.dars}|egizak=${x.egzOk}/${x.egz}`); x.ex.forEach(e => out.push(`  e|${e.savol}|bola=${e.javob}|togri=${e.togri_javob}|xato_turi=${e.xato_turi || '-'}`)); });
    (b.vazifa || []).filter(v => v.berildi === kun || v.doneSana === kun || (!v.done && v.muddat >= kun)).forEach(v => out.push(`VZ|fan=${v.fan}${v.bolim ? '|bolim=' + v.bolim : ''}|n=${v.n}|qildi=${v.qildi}|ok=${v.ok}|holat=${v.done ? 'bajarildi' : v.muddat < kun ? 'kechikdi' : 'jarayonda'}`));
    odam.push({ b, ids: ids.map(id => (BJ.gen.reg[id] || {}).nom || id), ch: ch.map(f => (A.FAN[f] || { nom: f === 'isinish' ? 'Isinish' : f }).nom) });
  });
  return { txt: out.join('\n'), odam };
}
