<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F4FA8">
<title>Road to 8 · IELTS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: boarding passes on a cool paper desk — worlds are tickets, medals are passport stamps, airmail stripes are the signature detail */
:root{
  --paper:#EEF2F8; --card:#FFFFFF; --card2:#F5F7FC; --ink:#15203B; --muted:#5A6684; --line:#D6DDEB;
  --red:#C92338; --blue:#1F4FA8; --on-blue:#FFFFFF; --green:#16805A; --amber:#C77B06;
  --ok-bg:#E2F3E9; --bad-bg:#FBE4E7; --near-bg:#FFF1D3; --hl:#FFEFB0;
  --gold:#A87A06; --silver:#6F7D96; --bronze:#9C5729;
  --shadow:0 1px 2px rgba(21,32,59,.06),0 8px 24px rgba(21,32,59,.07);
  --f-d:"Unbounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-b:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-m:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0C1222; --card:#141C31; --card2:#1A243D; --ink:#E6EBF6; --muted:#9AA6C3; --line:#28334F;
  --red:#FF6175; --blue:#7AA3FF; --on-blue:#0C1222; --green:#43CF91; --amber:#F4B545;
  --ok-bg:#123A2B; --bad-bg:#3E1923; --near-bg:#3A2E12; --hl:#4C3F0E;
  --gold:#E6B84A; --silver:#B3BED3; --bronze:#D99062; --shadow:0 0 0 1px rgba(255,255,255,.02); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0C1222; --card:#141C31; --card2:#1A243D; --ink:#E6EBF6; --muted:#9AA6C3; --line:#28334F;
  --red:#FF6175; --blue:#7AA3FF; --on-blue:#0C1222; --green:#43CF91; --amber:#F4B545;
  --ok-bg:#123A2B; --bad-bg:#3E1923; --near-bg:#3A2E12; --hl:#4C3F0E;
  --gold:#E6B84A; --silver:#B3BED3; --bronze:#D99062; --shadow:0 0 0 1px rgba(255,255,255,.02); color-scheme:dark }

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-b);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-d);font-weight:700;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(22px,3.2vw,32px)} h2{font-size:clamp(18px,2.2vw,22px)} h3{font-size:17px;font-family:var(--f-b);font-weight:800}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-block:12px 64px;display:flex;flex-direction:column;gap:18px}
.mut{color:var(--muted)} .sm{font-size:14px} .mono{font-family:var(--f-m);font-variant-numeric:tabular-nums}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.cols{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:960px){.cols{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}}
.cols>*{min-width:0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{box-shadow:none;background:var(--card2)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.top .ttl{font-weight:800;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:15px;white-space:nowrap}
.pill.mono{font-family:var(--f-m)}

/* buttons */
.btn{appearance:none;border:0;border-radius:12px;min-height:48px;padding:10px 18px;font-weight:800;cursor:pointer;background:var(--blue);color:var(--on-blue);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-size:16px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--red);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.sm{min-height:40px;padding:6px 12px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ib{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:12px;min-width:44px;min-height:44px;cursor:pointer;font-size:18px;display:inline-flex;align-items:center;justify-content:center}

/* airmail stripe — the signature */
.air{height:6px;border-radius:6px 6px 0 0;background:repeating-linear-gradient(-45deg,var(--red) 0 10px,transparent 10px 18px,var(--blue) 18px 28px,transparent 28px 36px)}

/* hero / greeting */
.hello{display:flex;flex-direction:column;gap:6px}
.hello .eyebrow{font-family:var(--f-m);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* resume card */
.resume{display:flex;gap:14px;align-items:center;background:var(--blue);color:var(--on-blue);border-radius:var(--r);padding:16px 18px;text-decoration:none;border:0;cursor:pointer;text-align:left;width:100%}
.resume .big{font-size:30px}
.resume b{display:block;font-size:18px}

/* plan blocks */
.blk{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px dashed var(--line)}
.blk:first-of-type{border-top:0}
.bar{height:8px;background:var(--card2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);border-radius:99px}
.bar.blue>i{background:var(--blue)} .bar.amber>i{background:var(--amber)}

/* tiles */
.tile{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--ink);cursor:pointer;min-height:64px}
.tile .ic{font-size:26px;width:36px;text-align:center}
.tile b{display:block} .tile small{color:var(--muted);font-size:13px}
.tile.locked{opacity:.55}
.badge{background:var(--red);color:#fff;border-radius:99px;padding:2px 8px;font-size:13px;font-weight:800}

/* ticket (world) */
.ticket{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 120px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;text-decoration:none;color:var(--ink)}
.ticket .main{padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ticket .stub{border-left:2px dashed var(--line);padding:16px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--card2)}
.ticket .code{font-family:var(--f-m);font-weight:700;font-size:24px;letter-spacing:.06em}
.ticket .city{font-family:var(--f-d);font-size:20px}
.ticket.locked{opacity:.5;filter:saturate(.4)}
.ticket.castle .main{background:linear-gradient(90deg,var(--card2),var(--card))}
.route{display:flex;flex-direction:column;gap:14px;position:relative}
@media (max-width:520px){.ticket{grid-template-columns:minmax(0,1fr) 88px}.ticket .code{font-size:18px}}

/* stamps (medals) */
.stamps{display:flex;gap:6px}
.stamp{width:34px;height:34px;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--f-m);font-size:10px;font-weight:700;color:var(--muted);transform:rotate(-8deg)}
.stamp.bronze{border:2px solid var(--bronze);color:var(--bronze)} .stamp.silver{border:2px solid var(--silver);color:var(--silver)} .stamp.gold{border:2px solid var(--gold);color:var(--gold)}

/* stage cards */
.stage{display:flex;flex-direction:column;gap:10px}
.stage .hd{display:flex;gap:10px;align-items:center}
.stage .hd .ic{font-size:28px}
.lvls{display:flex;gap:8px;flex-wrap:wrap}
.lv{flex:1;min-width:90px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:800;text-decoration:none;color:var(--ink);padding:6px}
.lv.done{border-color:var(--green);background:var(--ok-bg)}
.lv.lock{opacity:.45;pointer-events:none}

/* question area */
.qwrap{display:flex;flex-direction:column;gap:14px}
.qtext{font-size:20px;font-weight:700;line-height:1.45}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{appearance:none;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px 16px;min-height:52px;cursor:pointer;font-size:17px;font-weight:600;color:var(--ink)}
.opt:hover{border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--card2)}
.opt.ok{border-color:var(--green);background:var(--ok-bg)}
.opt.bad{border-color:var(--red);background:var(--bad-bg)}
.inp{width:100%;min-height:52px;border:2px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--card);font-size:18px}
.inp:focus{border-color:var(--blue);outline:none}
.inp.ok{border-color:var(--green);background:var(--ok-bg)} .inp.bad{border-color:var(--red);background:var(--bad-bg)}
textarea.inp{min-height:260px;line-height:1.6;resize:vertical}
.fb{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--ok-bg)} .fb.bad{background:var(--bad-bg)} .fb.near{background:var(--near-bg)}
.uz+.ru{margin-top:4px;padding-top:4px;border-top:1px dashed var(--line);color:var(--muted);font-size:15px}
ul.tl{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.prog{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;flex:1;min-width:60px}
.prog>i{display:block;height:100%;background:var(--blue)}
.timer{font-family:var(--f-m);font-weight:700}
.timer.low{color:var(--red)}

/* passage */
.split{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:900px){.split{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}.split .stick{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}}
.split>*{min-width:0}
.ppt{display:flex;flex-direction:column;gap:12px;font-size:17px;line-height:1.7}
.ppt .pl{font-family:var(--f-m);font-weight:700;color:var(--red);margin-right:8px}
.w{text-decoration:underline dotted var(--muted);text-underline-offset:4px;cursor:pointer}
.w:hover{background:var(--hl)}
.qlist{display:flex;flex-direction:column;gap:14px}
.qi{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:start}
.qi .n{font-family:var(--f-m);font-weight:700;color:var(--muted);padding-top:12px}
.tf{display:flex;gap:8px;flex-wrap:wrap}
.tf .opt{min-height:44px;padding:8px 14px;flex:1;text-align:center}

/* player */
.player{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:var(--r);background:var(--card2);border:1px solid var(--line)}
.play{width:72px;height:72px;border-radius:50%;border:0;background:var(--blue);color:var(--on-blue);font-size:28px;cursor:pointer;flex:none}
.lines{display:flex;gap:3px;flex-wrap:wrap}
.lines i{width:10px;height:10px;border-radius:3px;background:var(--line)}
.lines i.d{background:var(--blue)} .lines i.c{background:var(--amber)}
.tr-line{display:grid;grid-template-columns:90px minmax(0,1fr);gap:8px;padding:6px 0;border-top:1px dashed var(--line)}

/* diff */
.diff{line-height:2;font-size:18px}
.diff span{padding:2px 4px;border-radius:6px;margin-right:2px}
.diff .k{background:var(--ok-bg)} .diff .m{background:var(--bad-bg);text-decoration:underline wavy var(--red)} .diff .x{color:var(--muted);text-decoration:line-through}

/* table */
.tbl{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left}
.tblw{overflow-x:auto}

/* sheet & toast */
.scrim{position:fixed;inset:0;background:rgba(10,15,30,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:720px;max-height:86vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:760px){.scrim{align-items:center}.sheet{border-radius:20px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:800;z-index:30;max-width:90vw;text-align:center}
.warn{background:var(--near-bg);border-radius:12px;padding:10px 14px;font-size:15px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:13px;font-weight:700}
.big-score{font-family:var(--f-d);font-size:52px;line-height:1}
.ck{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.ck input{width:22px;height:22px;margin-top:2px;flex:none}
.wcard{display:flex;flex-direction:column;gap:6px}
.wcard .en{font-size:20px;font-weight:800}
.flip{min-height:220px;align-items:center;justify-content:center;text-align:center}
svg:not(.art):not(.mz-l):not(.mm) text{fill:var(--ink);font-family:var(--f-b)}

/* v0.2 — goal pass, today's lesson, notes, adapt chips, lex, timeline */
.goal{display:grid;grid-template-columns:104px minmax(0,1fr);background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);text-decoration:none;color:var(--ink);overflow:hidden}
.goal .gl{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:12px 8px;border-right:2px dashed var(--line);background:var(--card2)}
.goal .gb{font-size:30px;font-weight:700;color:var(--red);line-height:1}
.goal .gm{padding:12px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.goal .mis{font-style:italic;color:var(--muted);overflow-wrap:anywhere}
.lesson{position:relative;display:flex;gap:14px;align-items:center;background:var(--ink);color:var(--paper);border-radius:var(--r);padding:20px 18px 16px;text-decoration:none;overflow:hidden;min-height:72px}
.lesson::before{content:"";position:absolute;inset:0 0 auto;height:6px;background:repeating-linear-gradient(-45deg,var(--red) 0 10px,transparent 10px 18px,var(--blue) 18px 28px,transparent 28px 36px)}
.lesson .big{font-size:32px}
.lesson b{display:block;font-size:19px;font-family:var(--f-d);font-weight:700}
.lesson .sub{display:block;font-size:15px;opacity:.85;overflow-wrap:anywhere}
.lesson .dots{display:flex;gap:6px;flex:none}
.lesson .dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--paper);opacity:.6}
.lesson .dots i.on{background:var(--green);border-color:var(--green);opacity:1}
.lesson.done{background:var(--card);color:var(--ink);border:2px solid var(--green)}
.lesson.done .dots i{border-color:var(--green)}
.note{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:15px;color:var(--ink);text-decoration:none}
.note.ok{background:var(--ok-bg);border-color:transparent}
.note.warnn{background:var(--near-bg);border-color:transparent}
.note.warnn span{flex:1;min-width:200px}
.chip.mode.up{color:var(--green);border-color:var(--green)} .chip.mode.down{color:var(--amber);border-color:var(--amber)}
.chip.warmc{align-self:flex-start;color:var(--blue)}
.kw{display:flex;gap:8px;flex-wrap:wrap}
.chip.big{min-height:44px;padding:8px 14px;font-size:15px;cursor:pointer}
.steps{display:flex;flex-direction:column;gap:14px}
.ticket.step.cur{border:2px solid var(--blue)}
.ticket.step.done .main{opacity:.85}
.ticket.step .code{color:var(--blue)} .ticket.step.done .code{color:var(--green)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px}
.wbar{height:96px;width:100%;max-width:40px;background:var(--card2);border:1px solid var(--line);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.wbar i{display:block;width:100%;background:var(--amber)}
.wd.now .wbar{border:2px solid var(--blue)}
.mst{display:flex;flex-direction:column;gap:14px;border-left:3px dashed var(--line);margin-left:8px;padding-left:20px}
.ms{position:relative;display:flex;flex-direction:column;gap:2px}
.ms::before{content:"";position:absolute;left:-29px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--card);border:3px solid var(--line)}
.ms.done::before{border-color:var(--green);background:var(--green)} .ms.late::before{border-color:var(--amber)} .ms.rev::before{border-color:var(--blue)}
.ms .mono{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;gap:6px;flex-wrap:wrap}
.seg .opt,.fchip{flex:none;min-height:44px;padding:8px 14px;font-size:15px;text-align:center}
.ans{background:var(--ok-bg);border-radius:12px;padding:12px 14px;line-height:1.6;overflow-wrap:anywhere}
.bar.red>i{background:var(--red)}
.lext tbody tr{cursor:pointer} .lext td{vertical-align:top}
@media (max-width:520px){.goal{grid-template-columns:84px minmax(0,1fr)}.goal .gb{font-size:24px}.lesson{padding:18px 14px 14px;gap:10px}.lesson .big{font-size:26px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ===== v0.3 kino qatlami: globus, parvoz, syujet, shahar xaritasi, labirint, pasport (har ikki temada tungi sahna) ===== */
:root{--nt:#070B18;--nt2:#101B36;--nt-ink:#E6EBF6;--nt-mut:#9AA6C3;--nt-line:#28334F;--gld:#F4B545}
body.noscroll{overflow:hidden}
.globe-wrap{position:relative;border-radius:var(--r);overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,#0F1A36 0%,#050914 70%);height:clamp(340px,58vh,600px);box-shadow:var(--shadow)}
.globe-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
.g-hud{position:absolute;left:16px;top:14px;display:flex;flex-direction:column;gap:2px;color:var(--nt-mut);pointer-events:none;max-width:calc(100% - 32px)}
.g-hud .mono,.mz-hud .mono,.cine-hud .mono,.cp-ttl .mono,.hero .eb,.pp-cover .mono{font-family:var(--f-m);font-size:12px;letter-spacing:.14em}
.g-hud b{font-family:var(--f-d);font-size:clamp(20px,3vw,30px);color:#fff;font-weight:700}
.g-hud b .mut{color:var(--nt-mut);font-size:.7em}
.g-act{position:absolute;left:16px;right:16px;bottom:14px;display:flex;gap:8px;flex-wrap:wrap}
.g-tip{position:absolute;right:16px;top:16px;color:var(--nt-mut);pointer-events:none}
@media (max-width:700px){.g-tip{display:none}}
.g-act .btn.ghost,.cine-page .btn.ghost,.hero .btn.ghost{background:rgba(20,28,49,.78);color:var(--nt-ink);border-color:var(--nt-line)}
.cine-ov{position:fixed;inset:0;z-index:28;background:#03060F;color:var(--nt-ink)}
.cine-cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.cine-hud{position:absolute;left:max(20px,env(safe-area-inset-left,0px));top:calc(18px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:4px;color:var(--nt-mut);pointer-events:none}
.cine-hud b{font-family:var(--f-d);font-size:clamp(22px,4vw,40px);color:#fff}
.cine-hud #ckm{font-family:var(--f-m);font-size:16px;color:var(--gld)}
.cine-skip{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px))}

function analyzeWriting(text, it, task) {

  C.push({ ok: words >= it.minWords, uz: "So'z soni: " + words + ' (kamida ' + it.minWords + ')', ru: 'Слов: ' + words + ' (минимум ' + it.minWords + ')' });
  if (it.part === 'full') C.push({ ok: paras >= 3, uz: 'Abzaslar: ' + paras + ' (3–4 kerak, orasida bo\'sh qator)', ru: 'Абзацев: ' + paras + ' (нужно 3–4, через пустую строку)' });
  C.push({ ok: /\b(overall|in general|generally|it is clear that|it is evident that)\b/.test(low), uz: 'Overview bor («Overall, …»)', ru: 'Есть overview («Overall, …»)' });
  const first = text.split(/[.!?]\s/)[0] || '', ov = ngramOverlap(first, task, 3);
  C.push({ ok: ov < 0.5, uz: 'Kirish savoldan ko\'chirilmagan (o\'xshashlik ' + Math.round(ov * 100) + '%)', ru: 'Введение не скопировано (совпадение ' + Math.round(ov * 100) + '%)' });
  const cmp = (low.match(/\b\w+er than\b|\bmore \w+ than\b|\bless \w+ than\b|\bthe (highest|lowest|largest|smallest|most|least)\b|\b(twice|half|three times) as\b|\bwhile\b|\bwhereas\b|\bin contrast\b|\bcompared (to|with)\b/g) || []).length;
  C.push({ ok: cmp >= (it.part === 'full' ? 3 : 1), uz: 'Taqqoslash iboralari: ' + cmp, ru: 'Сравнительных конструкций: ' + cmp });

  return { words, checks: C, errs };

function chartSVG(c) {
  const Wd = 640, H = 330, pl = 42, pr = 12, pt = 44, pb = 44, max = Math.ceil(Math.max.apply(null, c.series.flatMap(s => s.data)) / 10) * 10 || 10;

  c.categories.forEach((cat, i) => { const x0 = pl + i * cw + (cw - bw * c.series.length) / 2; c.series.forEach((s, j) => { const v = s.data[i], x = x0 + j * bw; g += `<rect x="${x + 2}" y="${y(v)}" width="${bw - 4}" height="${y(0) - y(v)}" rx="3" style="fill:${cols[j]}"/><text x="${x + bw / 2}" y="${y(v) - 6}" text-anchor="middle" font-size="12" font-weight="700">${v}</text>`; }); g += `<text x="${pl + i * cw + cw / 2}" y="${H - pb + 22}" text-anchor="middle" font-size="14" font-weight="700">${esc(cat)}</text>`; });
  const leg = c.series.map((s, j) => `<rect x="${pl + j * 92}" y="12" width="14" height="14" rx="3" style="fill:${cols[j]}"/><text x="${pl + j * 92 + 20}" y="24" font-size="13">${esc(s.name)}</text>`).join('');

/* ================= MIGRATE ================= */
function migrate(s) {
  if (!s || typeof s !== 'object') return s;
  const d = defaults(); Object.keys(d).forEach(k => { if (s[k] === undefined || s[k] === null && d[k] !== null && typeof d[k] === 'object') s[k] = d[k]; });
  if (!s.v || s.v < 2) {
    (s.mistakes || []).forEach(m => { if (!m.tag) m.tag = tagOf(m.item, m.your); });
    Object.keys(s.srs || {}).forEach(id => { const c = s.srs[id]; if (c && c.type === 'v' && GL[c.key]) { const g = GL[c.key]; if (!s.lex[g.id]) s.lex[g.id] = { k: glKeys(g.en)[0], src: 'learn', ts: Date.now(), n: 1 }; } });
    (s.history || []).slice().reverse().forEach(h => { const p = String(h.key || '').split('-'); const k = p[1] === 'dict' ? 'dict' : p[1] === 'tr' ? 'tr' : SKILLS[p[1]] && /^\d$/.test(p[2] || '') ? p[1] : null; if (!k) return; const a = s.skill[k] || (s.skill[k] = []); a.push({ a: h.score, sp: null, ts: h.ts }); if (a.length > 5) a.splice(0, a.length - 5); });
    s.v = 2;
  }
  if (s.v < 3) { /* v0.3: syujet holati qo'shiladi; mavjud natijalar o'zgarmaydi. Yengilgan shaharlarning varaqlari beriladi. */
    s.story = Object.assign(storyDefaults(), s.story && typeof s.story === 'object' ? s.story : {});
    Object.keys(s.worlds || {}).forEach(w => { const pg = (ST.pages || []).find(p => p.w === w); if (pg && s.worlds[w] && s.worlds[w].done && !s.story.pages[pg.n]) s.story.pages[pg.n] = Date.now(); });
    s.v = 3;
  }
  if (!s.story || typeof s.story !== 'object') s.story = storyDefaults(); else { const sd = storyDefaults(); Object.keys(sd).forEach(k => { if (s.story[k] == null) s.story[k] = sd[k]; }); s.story.fx = Object.assign(sd.fx, s.story.fx || {}); }
  if (s.profile && (!s.goal || typeof s.goal !== 'object')) s.goal = { band: M.goal.band, exam: M.goal.exam, mission: '', start: s.profile.created || todayKey() };
  return s;
}

/* ================= BAND ================= */
function rawToBand(tbl, raw) { for (const [min, b] of tbl) if (raw >= min) return b; return 0; }
function overall(arr) { const v = arr.filter(x => x > 0); if (!v.length) return 0; const avg = v.reduce((a, b) => a + b, 0) / v.length, f = Math.floor(avg), r = avg - f; return r < 0.25 ? f : r < 0.75 ? f + 0.5 : f + 1; }
function bandChartSVG() {
  const ms = S.mocks.slice(-10); if (!ms.length) return '';
  const Wd = 640, H = 240, pl = 36, pr = 16, pt = 16, pb = 36, y = v => pt + (H - pt - pb) * (1 - (v - 4) / 5), x = i => pl + (ms.length === 1 ? (Wd - pl - pr) / 2 : i * (Wd - pl - pr) / (ms.length - 1));
  let g = ''; for (let v = 4; v <= 9; v++) g += `<line x1="${pl}" x2="${Wd - pr}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)"/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end" font-size="12">${v}</text>`;
  g += `<line x1="${pl}" x2="${Wd - pr}" y1="${y(8)}" y2="${y(8)}" style="stroke:var(--red);stroke-dasharray:6 5;stroke-width:2"/><text x="${Wd - pr}" y="${y(8) - 6}" text-anchor="end" font-size="12" font-weight="700">maqsad 8.0</text>`;
  g += `<polyline points="${ms.map((m, i) => x(i) + ',' + y(m.overall)).join(' ')}" style="fill:none;stroke:var(--blue);stroke-width:3"/>` + ms.map((m, i) => `<circle cx="${x(i)}" cy="${y(m.overall)}" r="5" style="fill:var(--blue)"/><text x="${x(i)}" y="${H - pb + 20}" text-anchor="middle" font-size="11">${esc(m.date.slice(5))}</text>`).join('');
  return `<svg viewBox="0 0 ${Wd} ${H}" width="100%" role="img" aria-label="Band dinamikasi">${g}</svg>`;
}
function screenBand() {
  const bands = []; for (let b = 9; b >= 3; b -= 0.5) bands.push(b);

  const calc = () => { const l = $('#bl').value, r = $('#br').value; const L1 = l !== '' ? rawToBand(M.bandTables.listening, +l) : 0, R1 = r !== '' ? rawToBand(M.bandTables.readingAcademic, +r) : 0, Wb = +$('#bw').value, Sb = +$('#bs').value; return { L: L1, R: R1, W: Wb, S: Sb, overall: overall([L1, R1, Wb, Sb]) }; };

/* ================= STORY PLAYER (🎬 boblar) ================= */
const WHO = { passport: () => '🛂 PASSPORT', professor: () => '✒️ PROF. IRIS VANE', shadow: () => "👤 YESTERDAY'S " + nm('{name}').toUpperCase(), narrator: () => '' };
function chapterOpen(id) { const C = ST.chapters[id]; if (!C) return false; if (C.end) return !!(WORLDS[C.w] && wState(C.w).done); return true; }
function screenChapter(id) {
  const C = ST.chapters[id]; if (!C) return go('home');
  if (!chapterOpen(id)) { toast('🔒 Bu bob Boss yengilgandan keyin ochiladi'); return go(C.w || 'home'); }
  const sto = story(); curBlock = 'eye';
  let i = Math.max(0, Math.min(C.panels.length, sto.pos[id] || 0)); if (sto.seen[id] && i >= C.panels.length) i = 0;
  const chk = C.check.map(q => ({ q, ord: shuffle(q.o.map((_, k) => k)) })), ans = {};
  const back = C.w ? C.w : 'home';
  const draw = (dir) => {
    sto.pos[id] = i; save(); stopSpeak();
    const dots = C.panels.map((_, k) => `<i class="${k < i ? 'on' : k === i ? 'cur' : ''}"></i>`).join('') + `<i class="${i >= C.panels.length ? 'cur' : ''}">🕵️</i>`;
    const head = `<div class="cp-top"><a class="ib" href="#${back}" aria-label="Orqaga">←</a><div class="cp-ttl"><span class="mono">🎬 ${C.n ? 'CHAPTER ' + C.n : 'PROLOGUE'} · ${esc(C.flag)} ${esc(C.city)}</span><b>${esc(C.title)}</b></div><span class="sp"></span><button class="ib" data-read aria-label="Avtomatik o'qish">${sto.fx.read ? '🔊' : '🔇'}</button></div><div class="cp-dots">${dots}</div>`;
    if (i < C.panels.length) {
      const P = C.panels[i], who = WHO[P.who] ? WHO[P.who]() : '';
      app.innerHTML = `<div class="cine-page${dir ? ' go-' + dir : ''}">${head}
        <div class="cp-body"><figure class="panel${reducedFX() ? '' : ' kb'}" data-swipe>${artSVG(P.art, C.title)}<figcaption class="mono">${i + 1} / ${C.panels.length}</figcaption></figure>
          <div class="cap who-${P.who}">${who ? `<span class="who mono">${esc(who)}</span>` : ''}<p class="en">${tap(nm(P.en))}</p>
            <div class="gloss" hidden>${tx({ uz: nm(P.uz), ru: nm(P.ru) })}</div>
            <div class="row cp-tools"><button class="btn ghost sm" data-say>🔊 Eshitish</button><button class="btn ghost sm" data-gl>🌐 Tarjima</button></div>
            <p class="sm mut cp-hint">So'zni bossang — ma'nosi chiqadi va lug'atga tushadi.</p></div></div>
        <div class="row cp-nav"><button class="btn ghost" data-prev ${i ? '' : 'disabled'}>◀ Oldingi</button><span class="sp"></span><button class="btn" data-next>${i === C.panels.length - 1 ? '🕵️ Tekshiruv ▶' : 'Keyingi ▶'}</button></div></div>`;
      if (sto.fx.read && dir) speak(nm(P.en), C.accent);
      on('[data-say]', () => speak(nm(P.en), C.accent));
      on('[data-gl]', () => { const g = $('.gloss', app); g.hidden = !g.hidden; });
      on('[data-prev]', () => { if (i > 0) { i--; draw('b'); } });
      on('[data-next]', () => { i++; if (i === C.panels.length) { sto.seen[id] = sto.seen[id] || Date.now(); if (C.page && !sto.pages[C.page]) sto.pages[C.page] = Date.now(); if (C.page) sfx('page'); } draw('f'); });
      const fg = $('[data-swipe]', app); let sx = null;
      fg.addEventListener('pointerdown', e => { sx = e.clientX; }); fg.addEventListener('pointerup', e => { if (sx == null) return; const dx = e.clientX - sx; sx = null; if (dx < -50) $('[data-next]', app).click(); else if (dx > 50 && i > 0) $('[data-prev]', app).click(); });
    } else {
      app.innerHTML = `<div class="cine-page">${head}<div class="card cp-check"><div class="air" style="margin:-18px -18px 0"></div><h2>🕵️ Detektiv tekshiruvi</h2><p class="sm mut">Sahnalarni eslab, 2 ta savolga javob ber. Har to'g'ri javob — +10 XP (birinchi marta).</p>
        ${chk.map((c, qi) => `<div class="dq" data-q="${qi}"><p><b>${qi + 1}. ${tap(nm(c.q.q))}</b></p><div class="opts">${c.ord.map(k => `<button class="opt" data-dq="${qi}" data-o="${k}">${esc(nm(c.q.o[k]))}</button>`).join('')}</div><div class="fb"></div></div>`).join('')}
        <div class="row"><button class="btn ghost" data-prev>◀ Sahnalarga</button><span class="sp"></span><button class="btn" data-fin disabled>${C.page ? '📜 Varaqni pasportga qo\'yish →' : 'Davom etish →'}</button></div></div></div>`;
      on('[data-dq]', e => {
        const b = e.currentTarget, qi = +b.dataset.dq, k = +b.dataset.o, c = chk[qi]; if (ans[qi] != null) return; ans[qi] = k;
        const right = k === c.q.a, key = id + ':' + qi, box = $(`.dq[data-q="${qi}"]`, app);
        $$('[data-dq="' + qi + '"]', app).forEach(x => { const kk = +x.dataset.o; x.disabled = true; if (kk === c.q.a) x.classList.add('ok'); else if (kk === k) x.classList.add('bad'); });
        if (right && !sto.checks[key]) { sto.checks[key] = 1; addXP(10); }
        $('.fb', box).innerHTML = (right ? '<div class="chip" style="color:var(--green)">✓ To\'g\'ri! +10 XP</div>' : '<div class="chip" style="color:var(--red)">✗ Unchalik emas</div>') + `<div class="sm">${tx(c.q.ex)}</div>`;
        if (Object.keys(ans).length === chk.length) $('[data-fin]', app).disabled = false; save();
      });
      on('[data-prev]', () => { i = C.panels.length - 1; draw('b'); });
      on('[data-fin]', () => { sto.pos[id] = 0; save(); const nx = C.next; go(nx.startsWith('parvoz-') ? nx : nx === C.w ? C.w : nx); });
    }
    on('[data-read]', () => { sto.fx.read = !sto.fx.read; save(); const b = $('[data-read]', app); b.textContent = sto.fx.read ? '🔊' : '🔇'; if (!sto.fx.read) stopSpeak(); });
  };
  draw(null);
}

function shadowRace() { const t = day().xp, y = (S.days[addDays(todayKey(), -1)] || {}).xp || 0; return { t, y, ahead: t > y, diff: Math.abs(t - y) }; }

  if (!sto.flights['TAS-SYD']) return { art: 'ticket', href: '#parvoz-TAS-SYD', ic: '✈️', eb: 'FLIGHT R8-001', t: 'Tashkent → Sydney', d: '11 820 km — birinchi varaq tomon parvoz.' };

  for (const w of Object.keys(ST.maze)) { if (WORLDS[w] && wState(w).done && ST.chapters[w + '-end'] && !sto.seen[w + '-end']) return { art: 'piano', href: '#bob-' + w + '-end', ic: '📜', eb: 'CHAPTER ' + ST.chapters[w + '-end'].n + ' · FINALE', t: ST.chapters[w + '-end'].title, d: 'Boss yengildi — varaq topildi! Ichida nima yozilganini o\'qi.' }; }
  if (ST.maze[cw] && !wState(cw).done) { const nx = mazeNext(cw), N = ST.maze[cw].nodes[nx.node] || {}; return { art: 'mapunfold', href: '#' + cw, ic: '🧭', eb: 'CITY MAP · ' + (worldMeta(cw).city || '').toUpperCase(), t: N.name || 'Shahar xaritasi', d: nx.label }; }

}

function anyLevel(w, st) { return (WORLDS[w].stages[st].levels || []).some((_, i) => levelDone(w, st, i)); }
function bronzeCount(w) { return STAGES.filter(s => levelDone(w, s.k, 0)).length; }
function histHas(re) { return (S.history || []).some(h => re.test(String(h.key || ''))); }

/* ================= MINI-MAZE (🌀 1–2 daqiqalik labirint, so'z-darvozalar) ================= */
const MMD = [[0, -1, 1, 4], [1, 0, 2, 8], [0, 1, 4, 1], [-1, 0, 8, 2]];
function mmBuild(seed, cols, rows) {
  const rnd = mulberry32(seed), N = cols * rows, wall = new Array(N).fill(15), vis = new Array(N).fill(false), stk = [0]; vis[0] = true;
  while (stk.length) { const c = stk[stk.length - 1], x = c % cols, y = (c / cols) | 0, nb = MMD.map(d => [x + d[0], y + d[1], d]).filter(([a, b]) => a >= 0 && b >= 0 && a < cols && b < rows && !vis[b * cols + a]); if (!nb.length) { stk.pop(); continue; } const [a, b, d] = nb[Math.floor(rnd() * nb.length)], n = b * cols + a; wall[c] &= ~d[2]; wall[n] &= ~d[3]; vis[n] = true; stk.push(n); }
  const prev = new Array(N).fill(-1), q = [0], sn = new Array(N).fill(false); sn[0] = true;
  while (q.length) { const c = q.shift(); if (c === N - 1) break; const x = c % cols, y = (c / cols) | 0; MMD.forEach(d => { if (wall[c] & d[2]) return; const n = (y + d[1]) * cols + x + d[0]; if (!sn[n]) { sn[n] = true; prev[n] = c; q.push(n); } }); }
  const path = []; for (let c = N - 1; c !== -1; c = prev[c]) path.unshift(c);
  const gates = [0.3, 0.56, 0.82].map(f => path[Math.round(f * (path.length - 1))]), onP = new Set(path), dead = [];
  for (let c = 1; c < N - 1; c++) { const open = [1, 2, 4, 8].filter(b => !(wall[c] & b)).length; if (open === 1 && !onP.has(c)) dead.push(c); }
  for (let i = dead.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [dead[i], dead[j]] = [dead[j], dead[i]]; }
  return { cols, rows, wall, path, gates, stars: dead.slice(0, 3), exit: N - 1 };
}

function mmSeen(m, Mz) { const s = new Set(); m.vis.forEach(c => { s.add(c); const x = c % Mz.cols, y = (c / Mz.cols) | 0; MMD.forEach(d => { if (!(Mz.wall[c] & d[2])) s.add((y + d[1]) * Mz.cols + x + d[0]); }); }); return s; }
